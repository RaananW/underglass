<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Underglass core: a media change under an Instrument scene</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #e3e5e9; color: black; font: 14px system-ui; }
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; margin: 0; padding: 4px 8px; border-radius: 6px; background: rgb(255 255 255 / 0.85);
      font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    /* The panel is as tall as its content. A media preference removes the border of an inner box (`?media=` picks which one), so the
       panel is 20 px shorter and an object at its bottom edge lies where the old box was. */
    .mc-panel { position: absolute; left: 40px; top: 40px; box-sizing: border-box; width: 320px; border-radius: 14px; padding: 0; margin: 0;
      background: rgb(223, 225, 229); color: rgb(28, 30, 36); }
    #mc-flow { box-sizing: content-box; height: 170px; border: 10px solid rgb(40, 90, 200); }
    @media (prefers-contrast: more) { html[data-media="contrast"] #mc-flow { border-width: 0; } }
    @media (forced-colors: active) { html[data-media="forced"] #mc-flow { border-width: 0; } }
    @media (prefers-color-scheme: dark) { html[data-media="scheme"] #mc-flow { border-width: 0; } html[data-media="scheme"] .mc-panel { background: rgb(42, 45, 52); } }
    /* `?shift=1`: the panel sits below a sibling in the flow whose height the same preference changes, so the layer's origin moves with its box. */
    html[data-shift] .mc-panel { position: relative; left: 40px; top: 0; display: flow-root; }
    #mc-sibling { height: 40px; }
    @media (prefers-contrast: more) { html[data-media="contrast"] #mc-sibling { height: 20px; } }
    @media (forced-colors: active) { html[data-media="forced"] #mc-sibling { height: 20px; } }
    @media (prefers-color-scheme: dark) { html[data-media="scheme"] #mc-sibling { height: 20px; } }
    .mc-panel h2 { margin: 8px 12px; font-size: 14px; line-height: 18px; font-weight: 600; }
    .mc-panel input[type="range"] { appearance: none; position: absolute; margin: 0; padding: 0; background: transparent; outline: none; cursor: pointer; border-radius: 50%; }
    .mc-panel input[type="range"]::-webkit-slider-thumb { appearance: none; width: 1px; height: 1px; background: transparent; }
    #mc-near { left: 24px; top: 48px; width: 64px; height: 64px; }
    /* On the panel's bottom-right corner. */
    #mc-edge { right: 0; bottom: 0; width: 64px; height: 64px; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/core-scene-media-change/page.ts"></script>
</body>
</html>
