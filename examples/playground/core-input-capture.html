<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,"><title>Underglass core: input events and captures</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(222, 225, 230); color: rgb(28, 30, 36); font: 14px system-ui; }
    #frame { position: fixed; inset: 0; }
    #status { position: fixed; right: 8px; bottom: 6px; margin: 0; padding: 4px 8px; background: rgb(255 255 255 / 0.85); color: black; font: 11px/1.3 system-ui; white-space: pre-wrap; pointer-events: none; z-index: 1; }
    #card { position: absolute; left: 40px; top: 40px; width: 440px; height: 300px; box-sizing: border-box; padding: 20px 24px; background: rgb(233, 235, 239); border-radius: 12px; }
    #card h2 { margin: 0 0 12px; font-size: 15px; }
    .row { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; height: 40px; }
    .row input[type=range] { width: 300px; margin: 0; }
    /* The marked range: its native paint is hidden (no track, no thumb), as a presenter that draws the value itself leaves it. */
    #marked { appearance: none; background: transparent; height: 40px; outline: none; }
    #marked::-webkit-slider-runnable-track { height: 100%; background: transparent; border: 0; }
    #marked::-webkit-slider-thumb { display: none; }
    /* A native repaint that does not depend on the value: the browser's paint event carries it, not an input capture. */
    #marked:hover { background: rgb(200, 60, 60); }
    #readout { display: inline-block; min-width: 6ch; font: 600 16px ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="frame"></div>
  <pre id="status" role="status"></pre>
  <script type="module" src="/src/core-input-capture/page.ts"></script>
</body>
</html>
