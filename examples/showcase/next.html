<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Underglass: real React controls, painted by the GPU (preview)</title>
    <meta name="description" content="A preview of the next Underglass home page. Underglass draws your original React DOM into one WebGPU compositor with the browser's HTML-in-Canvas API, while inputs, focus and clicks stay native.">
    <!-- A preview: the home page is the page to index until this one replaces it. -->
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://underglass.dev/">
    <meta name="theme-color" content="#07080a">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Before the first frame: marks a browser that has the APIs GPU presentation needs (the same test as
         `detectSupport` in src/support.ts), so the stylesheet can draw the stage's text as the GPU will. -->
    <script>try { var c = HTMLCanvasElement.prototype; if ("content" in c && typeof c.requestPaint === "function" && typeof c.updateElementGeometry === "function" && "gpu" in navigator) document.documentElement.classList.add("can-gpu"); } catch (e) {}</script>
  </head>
  <body>
    <div id="app"><!-- prerender:/src/next/prerender.tsx --></div>
    <script type="module" src="/src/next/main.ts"></script>
  </body>
</html>
