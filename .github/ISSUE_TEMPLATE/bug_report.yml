name: Bug report
description: Something renders, reacts or recovers incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. GPU mode depends on HTML-in-Canvas, which is new in Chrome and Edge 157, so the browser build matters a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal component or a showcase example and the actions that trigger it.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Presentation mode
      options: ["GPU (browser's HTML-in-Canvas)", "GPU (polyfill)", "Ordinary DOM", "Both"]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: From chrome://version (edge://version in Edge), for example "Edge 157.0.4341.42, Windows 11".
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Runtime status
      description: The `reason` from `controller.state()` or the showcase's Status line, if GPU fell back to DOM.
      render: text
  - type: input
    id: version
    attributes:
      label: Library version or commit
